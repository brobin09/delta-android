name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Free (no closed-source parts) build; emulator cores are downloaded on demand.
    - name: Build debug APK
      run: ./gradlew assembleFreeDynamicDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: delta-android-debug-apk
        path: lemuroid-app/build/outputs/apk/**/*.apk
