name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Free (no closed-source parts) build; emulator cores are downloaded on demand.
    - name: Build debug APK
      run: ./gradlew assembleFreeDynamicDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: delta-android-debug-apk
        path: lemuroid-app/build/outputs/apk/**/*.apk

    - name: Publish APK as a release
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK=$(find lemuroid-app/build/outputs/apk -name "*.apk" | head -n 1)
        cp "$APK" delta-android.apk
        gh release delete latest --yes --cleanup-tag || true
        gh release create latest delta-android.apk \
          --title "Delta for Android (latest build)" \
          --notes "Debug build of the latest commit. Download delta-android.apk on your phone and install it." \
          --latest
